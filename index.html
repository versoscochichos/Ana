<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Aniversário</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    /* Só a secção com a classe "ativa" aparece */
    section { display: none; flex-direction: column; gap: 16px; }
    section.ativa { display: flex; }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }
    .grupo-botoes { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .primario { background: #3b82f6; color: white; }
    .sucesso { background: #10b981; color: white; }
    .perigo { background: #ef4444; color: white; }
  </style>
</head>
<body>

  <main>
    <!-- Etapa 1: Nome -->
    <section id="etapa-nome" class="ativa">
      <h2>Identificação</h2>
      <p>Escreve o teu nome para desbloquear a página:</p>
      <input type="text" id="campo-nome" placeholder="O teu nome">
      <button id="btn-nome" class="primario">Continuar</button>
    </section>

    <!-- Etapa 2: Bolo -->
    <section id="etapa-bolo">
      <h2 id="titulo-bolo">Pergunta importante</h2>
      <p id="texto-bolo">Vais partilhar o bolo hoje?</p>
      <div class="grupo-botoes">
        <button id="btn-nao" class="perigo">Não</button>
        <button id="btn-sim" class="sucesso">Sim</button>
      </div>
    </section>

    <!-- Etapa 3: Parabéns -->
    <section id="etapa-final">
      <h2 id="titulo-final">Parabéns!</h2>
      <p>Muitas felicidades no teu dia! Fico à espera da minha fatia.</p>
    </section>
  </main>

  <script>
    // Seleção limpa dos elementos
    const etapaNome = document.getElementById("etapa-nome");
    const etapaBolo = document.getElementById("etapa-bolo");
    const etapaFinal = document.getElementById("etapa-final");

    let nome = "";

    // Passo 1 -> Passo 2
    document.getElementById("btn-nome").addEventListener("click", () => {
      nome = document.getElementById("campo-nome").value.trim() || "Aniversariante";
      document.getElementById("texto-bolo").textContent = `Olha ${nome}, vais-me dar bolo correto?`;
      etapaNome.classList.remove("ativa");
      etapaBolo.classList.add("ativa");
    });

    // Botão "Não" insiste sem reescrever o HTML
    document.getElementById("btn-nao").addEventListener("click", () => {
      document.getElementById("titulo-bolo").textContent = "Resposta inválida!";
      document.getElementById("texto-bolo").textContent = `Não aceito um não, ${nome}. Tenta outra vez!`;
    });

    // Passo 2 -> Passo 3
    document.getElementById("btn-sim").addEventListener("click", () => {
      document.getElementById("titulo-final").textContent = `Feliz Aniversário, ${nome}! 🎂`;
      etapaBolo.classList.remove("ativa");
      etapaFinal.classList.add("ativa");
    });
  </script>

</body>
</html>
