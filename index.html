<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Surpresa de Aniversário!</title>
</head>
<body>

  <script>
    let nome = prompt("Ana");

    let bolo = confirm("Olha " + nome + "! Vais-me dar bolo correto?");

    if (bolo === true) {
      alert("Acho bem, " + nome + "! Feliz Aniversario");
    } else {
      alert("Vou chorar 🥲🥲, " + nome + "! Mas mesmo assim desejo-te um Feliz Aniversario");
    }
  </script>

</body>
</html>
