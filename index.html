<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Fundo cor de papel creme com textura subtil */
      background-color: #f4efe6;
      color: #1c1917;
      font-family: Georgia, "Times New Roman", serif;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 420px;
      background-color: #fffdf9;
      border: 2px solid #1c1917;
      /* Sombra sólida estilo postal/impresso, sem o blur artificial típico de templates */
      box-shadow: 6px 6px 0px #1c1917;
      padding: 32px 28px;
    }

    .etiqueta {
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid #1c1917;
      padding: 3px 8px;
      margin-bottom: 18px;
      background-color: #fde047;
    }

    section {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    section.ativa {
      display: flex;
    }

    h1, h2 {
      font-size: 26px;
      line-height: 1.2;
      font-weight: normal;
    }

    p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #44403c;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      font-family: "Courier New", Courier, monospace;
      border: 2px solid #1c1917;
      background: #f4efe6;
      color: #1c1917;
      outline: none;
    }

    input:focus {
      background: #ffffff;
    }

    .acoes {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #1c1917;
      background-color: #1c1917;
      color: #fffdf9;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:active {
      transform: translate(2px, 2px);
    }

    button.secundario {
      background-color: transparent;
      color: #1c1917;
    }

    .nota-rodape {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px dashed #a8a29e;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      color: #78716c;
    }
  </style>
</head>
<body>

  <main>
    <span class="etiqueta" id="carimbo">Nota nº 01</span>

    <!-- Etapa 1 -->
    <section id="etapa-nome" class="ativa">
      <h1>Antes de mais nada...</h1>
      <p>Escreve aí o teu nome kkkkk</p>
      <input type="text" id="campo-nome" placeholder="O teu nome" autocomplete="off">
      <div class="acoes">
        <button id="btn-nome">Avançar -&gt;</button>
      </div>
    </section>

    <!-- Etapa 2 -->
    <section id="etapa-bolo">
      <h2 id="titulo-bolo">Acordo prévio</h2>
      <p id="texto-bolo">Vais guardar uma fatia de bolo para mim hoje, certo?</p>
      <div class="acoes">
        <button id="btn-nao" class="secundario">Nem pensar</button>
        <button id="btn-sim">Claro que sim</button>
      </div>
    </section>

    <!-- Etapa 3 -->
    <section id="etapa-final">
      <h1 id="titulo-final">Parabéns!</h1>
      <p id="texto-final">Fica registado. Muitos parabéns pelo teu dia — aproveita bem e não te esqueças do combinado.</p>
      <div class="nota-rodape" id="data-registo"></div>
    </section>
  </main>

  <script>
    const carimbo = document.getElementById("carimbo");
    const etapaNome = document.getElementById("etapa-nome");
    const etapaBolo = document.getElementById("etapa-bolo");
    const etapaFinal = document.getElementById("etapa-final");

    const frasesRecusa = [
      "Esse botão está avariado hoje. Tenta o outro.",
      "Boa tentativa, mas não aceito um não como resposta.",
      "Olha que dá azar no dia de anos ser forreta. Carrega no preto.",
      "Vá lá, não custa nada. Prometo que não peço a maior fatia."
    ];

    let nome = "";
    let tentativas = 0;

    document.getElementById("btn-nome").addEventListener("click", () => {
      const valor = document.getElementById("campo-nome").value.trim();
      if (valor === "") {
        document.getElementById("campo-nome").placeholder = "Escreve mesmo o nome primeiro...";
        return;
      }
      nome = valor;
      carimbo.textContent = "Cláusula do bolo";
      document.getElementById("texto-bolo").textContent = `Olha ${nome}, antes de abrir o resto: vais guardar uma fatia de bolo para mim, certo?`;
      etapaNome.classList.remove("ativa");
      etapaBolo.classList.add("ativa");
    });

    document.getElementById("btn-nao").addEventListener("click", () => {
      const frase = frasesRecusa[tentativas % frasesRecusa.length];
      document.getElementById("texto-bolo").textContent = frase;
      tentativas++;
    });

    document.getElementById("btn-sim").addEventListener("click", () => {
      carimbo.textContent = "Confirmado";
      carimbo.style.backgroundColor = "#bbf7d0";
      document.getElementById("titulo-final").textContent = `Muitos parabéns, ${nome}.`;
      document.getElementById("data-registo").textContent = "Compromisso assinado em " + new Date().toLocaleDateString("pt-PT");
      etapaBolo.classList.remove("ativa");
      etapaFinal.classList.add("ativa");
    });
  </script>

</body>
</html>


</body>
</html>
